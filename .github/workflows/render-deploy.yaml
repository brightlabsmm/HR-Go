name: Render Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target Render deployment environment (dev, staging, prod)
        required: true
        type: string
    secrets:
      render_deploy_hook:
        description: Render deploy hook URL for the target service
        required: true

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger Render deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.render_deploy_hook }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deploy hook secret is not configured for ${{ inputs.environment }}." >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/render-response.json -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")"
          echo "Render deploy hook responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/render-response.json >&2
            exit 1
          fi
