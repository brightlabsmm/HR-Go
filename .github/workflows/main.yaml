name: Server Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - prod
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - dev
      - staging
      - prod
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Server CI
    uses: ./.github/workflows/server-ci.yaml

  push-ghcr:
    name: Push GHCR Image
    needs: ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/staging' ||
       github.ref == 'refs/heads/prod')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-push.yaml

  deploy-dev:
    name: Deploy Dev
    needs: [ci, push-ghcr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev.yaml
    secrets: inherit

  deploy-staging:
    name: Deploy Staging
    needs: [ci, push-ghcr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-staging.yaml
    secrets: inherit

  deploy-prod:
    name: Deploy Prod
    needs: [ci, push-ghcr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/deploy-prod.yaml
    secrets: inherit
